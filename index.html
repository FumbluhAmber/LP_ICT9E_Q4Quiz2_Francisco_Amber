<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Score Analyzer</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<style>
		body { background-image: url(rah.jpg); }

		h1 {
			font-size: 2.8rem;
			margin-bottom: 20px;
			text-align: center;
		}
		.subject-col {
			text-align: center;
		}
		.subject-col img {
			height: 175px;
			width: 185px;
			object-fit: cover;
			margin-bottom: 10px;
			margin-left: 2px;
			border-radius: 8px;
		}
		input {
			width: 100px;
			margin: auto;
		}
		details {
			margin-top: 20px;
			text-align: center;
		}
	</style>
</head>
<body>
	<div class="container mt-5">
		<h1 class="text-warning">Score Analyzer</h1>
		<details class="mb-3">
			<summary class="text-primary">Click here!</summary>
			<p class="text-secondary">Enter your scores for Math, English, and Social Studies (0–100).<br>
			Click "Analyze Score" to see your average, performance category, and rating level.</p>
		</details>
		<div class="row justify-content-center mb-3">
			<div class="col-md-2 subject-col">
				<img src="maths.jpg" alt="Math">
				<input type="number" id="math" class="form-control" placeholder="Math" min="0" max="100" step="1">
			</div>
			<div class="col-md-2 subject-col">
				<img src="ENGLISH.jpeg" alt="English">
				<input type="number" id="english" class="form-control" placeholder="English" min="0" max="100" step="1">
			</div>
			<div class="col-md-2 subject-col">
				<img src="social.png" alt="Social">
				<input type="number" id="social" class="form-control" placeholder="Social" min="0" max="100" step="1">
			</div>
		</div>
		<div class="text-center">
			<button class="btn btn-warning text-primary" onclick="anzScore()">Analyze Score</button>
		</div>
	</div>

	<script>
		function anzScore() {
			let math = parseFloat(document.getElementById("math").value);
			let english = parseFloat(document.getElementById("english").value);
			let social = parseFloat(document.getElementById("social").value);

			if (isNaN(math) || isNaN(english) || isNaN(social)) {
				window.alert("Please enter all three subject scores.");
				return;
			}

			let avg = (math + english + social) / 3;

			let performance;
			if (avg >= 94 && avg <= 100) {
				performance = "Excellent";
			} else if (avg >= 87) {
				performance = "Above Satisfactory";
			} else if (avg >= 80) {
				performance = "Satisfactory";
			} else if (avg >= 75) {
				performance = "Needs Improvement";
			} else if (avg >= 70) {
				performance = "Poor";
			} else {
				performance = "Invalid Score Range";
			}

			let ratLevel;
			switch (true) {
				case (avg >= 94):
					ratLevel = 1;
					break;
				case (avg >= 87):
					ratLevel = 2;
					break;
				case (avg >= 80):
					ratLevel = 3;
					break;
				case (avg >= 75):
					ratLevel = 4;
					break;
				case (avg >= 70):
					ratLevel = 5;
					break;
				default:
					ratLevel = 6;
			}

			window.alert("Average Score: " + avg.toFixed(2) + "\nPerformance: " + performance + "\nRating Level: " + ratLevel);
		}
	</script>
</body>
</html>
